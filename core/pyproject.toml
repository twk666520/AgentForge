[project]
name = "agentforge-core"
version = "0.1.0"
description = "AgentForge Core - Skill framework and plugin system for AI agents"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AgentForge Contributors" }]
dependencies = []

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]