
[project]
name = "agentforge"
version = "0.1.0"
description = "AI Agent Enhancement Platform - Modular skills for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AgentForge Contributors" }]
keywords = ["ai-agent", "ocr", "translate", "vision", "dev-tools", "agent-enhancement"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
agentforge = "agentforge_cli:main"

[project.entry-points."agentforge.skills"]
ocr = "ocr_skill"
translate = "translate_skill"
vision = "vision_skill"
desktop = "desktop_skill"
github = "github_skill"
dev-toolkit = "dev_toolkit_skill"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps/cli/src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["core/tests"]
pythonpath = ["core/src"]

[tool.coverage.run]
source = ["agentforge_core"]
