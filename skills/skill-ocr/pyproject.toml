
[project]
name = "agentforge-skill-ocr"
version = "0.1.0"
description = "AgentForge OCR Skill - Text recognition with multiple backend support"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AgentForge Contributors" }]
dependencies = [
    "agentforge-core",
    "Pillow>=10.0.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."agentforge.skills"]
ocr = "ocr_skill"

[project.urls]
Homepage = "https://github.com/agentforge/agentforge"
Source = "https://github.com/agentforge/agentforge"
