
[project]
name = "agentforge-skill-translate"
version = "0.1.0"
description = "AgentForge Translate Skill - Multi-language translation"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AgentForge Contributors" }]
dependencies = [
    "agentforge-core",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."agentforge.skills"]
translate = "translate_skill"

[project.urls]
Homepage = "https://github.com/agentforge/agentforge"
Source = "https://github.com/agentforge/agentforge"
