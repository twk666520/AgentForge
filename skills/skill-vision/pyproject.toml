[project]
name = "agentforge-skill-vision"
version = "0.1.0"
description = "AgentForge Vision Skill - Image analysis and screen understanding"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AgentForge Contributors" }]
dependencies = [
    "agentforge-core",
    "Pillow>=10.0.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."agentforge.skills"]
vision = "vision_skill"