[project]
name = "agentforge-skill-github"
version = "0.1.0"
description = "AgentForge GitHub Skill - Repository analysis and documentation"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AgentForge Contributors" }]
dependencies = ["agentforge-core"]
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[project.entry-points."agentforge.skills"]
github = "github_skill"