[project]
name = "agentforge-plugin"
version = "0.1.0"
description = "AgentForge Plugin - Unified access to all AI agent skills"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AgentForge Contributors" }]
dependencies = [
    "agentforge-core",
    "Pillow>=10.0.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]