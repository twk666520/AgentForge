
name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install hatchling ruff pytest Pillow
          pip install -e core/
      - name: Lint
        run: ruff check core/src/ skills/skill-ocr/src/
      - name: Format
        run: ruff format --check core/src/ skills/skill-ocr/src/
      - name: Test Core
        run: pytest core/tests/ -v
      - name: Test OCR
        run: PYTHONPATH=skills/skill-ocr/src pytest skills/skill-ocr/tests/ -v
